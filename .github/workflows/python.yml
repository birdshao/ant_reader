name: Python checks
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CJK font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-arphic-uming
      - name: Python packages
        run: pip install -r requirements-scan.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Prepare example artwork
        run: python ant_reader.py prepare --book examples/starter_en.json --out output --tts none
